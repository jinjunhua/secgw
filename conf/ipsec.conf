# IPSec / IKEv2 Configuration for GM IPSec
# File: /etc/ipsec.conf
#
# Replace LEFT_IP / RIGHT_IP with actual gateway addresses.
# This config uses IKEv2 with GM algorithms:
#   IKE:  SM4-CBC-128, HMAC-SM3-256, PRF-HMAC-SM3, SM2-256
#   ESP:  SM4-GCM-128 (AEAD, no separate integrity)

version 2.0

config setup
    strictcrlpolicy = no
    uniqueids       = yes

# Gateway A configuration
conn gm-ipsec-tunnel
    # IKEv2
    keyexchange = ikev2
    type        = tunnel
    auto        = start

    # Local endpoint
    left        = %defaultroute   # or specific IP
    leftid      = @gateway-a
    leftsubnet  = 10.0.1.0/24
    leftcert    = /etc/ipsec.d/certs/gw-a.pem

    # Remote endpoint
    right       = 192.168.1.2
    rightid     = @gateway-b
    rightsubnet = 10.0.2.0/24

    # IKE SA algorithms (GM)
    # Format: encryption-integrity-prf-dh
    ike = sm4cbc128-sha256-prfsha256-modp2048!
    # Note: When GM plugin is loaded, use GM transform names:
    # ike = sm4cbc128-hmacSm3256-prfHmacSm3-sm2p256!

    # ESP SA algorithms (GM AEAD)
    # esp = sm4gcm128!
    esp = sm4gcm128-sm4gcm128!

    # Lifetimes
    ikelifetime  = 1h
    lifetime     = 1h
    margintime   = 5m

    # Dead Peer Detection
    dpdaction  = restart
    dpddelay   = 30s
    dpdtimeout = 120s

# PSK (for testing only - use certificates in production)
# See /etc/ipsec.secrets

# ---- PSK secrets (ipsec.secrets) ----
# @gateway-a @gateway-b : PSK "GM-IPSec-PSK-2024-Change-In-Production"
