# VPP Startup Configuration for GM IPSec Gateway
# File: /etc/vpp/startup.conf

unix {
    nodaemon
    log /var/log/vpp/vpp.log
    full-coredump
    cli-listen /run/vpp/cli.sock
    runtime-dir /var/run/vpp
}

api-trace {
    on
}

api-segment {
    gid vpp
}

socksvr {
    default
}

memory {
    main-heap-size 2048M
}

cpu {
    ## Configure which cores VPP runs on
    ## main-core 1
    ## corelist-workers 2-3
}

buffers {
    buffers-per-numa 128000
    default data-size 2048
    numa-alloc-mbufs 128000
}

dpdk {
    ## Bind NIC to DPDK before starting VPP:
    ##   dpdk-devbind.py --bind=vfio-pci 0000:00:08.0
    dev 0000:00:08.0 {
        name eth0
        num-rx-queues 4
        num-tx-queues 4
    }

    ## Number of RX descriptors per queue
    num-rx-desc 512
    num-tx-desc 512

    ## Enable crypto device for GM algorithms
    dev crypto_scheduler {
        workers 0
    }
}

plugins {
    plugin default { enable }
    ## GM IPSec plugin
    plugin gm_ipsec_plugin.so { enable }
}
