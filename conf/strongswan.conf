# strongSwan configuration for GM IPSec
# File: /etc/strongswan.conf

charon {
    # Load GM crypto plugin
    load_modular = yes

    plugins {
        include strongswan.d/charon/*.conf

        # GM crypto plugin (SM2/SM3/SM4)
        gm {
            load = yes
        }

        # Disable standard algorithms that conflict with GM
        # openssl { load = no }
    }

    # IKEv2 retransmit settings
    retransmit_tries  = 5
    retransmit_base   = 1.4
    retransmit_timeout = 4.0

    # SA lifetimes
    rekey_time  = 3600      # 1 hour
    reauth_time = 0

    # Logging
    syslog {
        daemon {
            default = 1
            ike     = 2
            esp     = 2
            net     = 1
        }
    }

    # VPP/DPDK kernel interface
    # Use kernel-vpp plugin when VPP is the data plane
    # kernel-vpp { load = yes }
}

# libstrongswan
libstrongswan {
    plugins {
        include strongswan.d/plugins/*.conf
        gm { load = yes }
    }
}
